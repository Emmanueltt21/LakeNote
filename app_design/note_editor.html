<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .prussian-border-focus { border: 1px solid rgba(2, 1, 34, 1.0); }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary-container min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopAppBar Shell -->
<header class="bg-[#020122] text-[#F2F3AE] font-['Oswald'] font-bold uppercase tracking-widest border-b border-[#020122]/15 flex items-center justify-between px-6 h-16 w-full fixed top-0 z-50">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="text-xl font-bold text-[#F2F3AE]">NOTES</span>
</div>
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined" data-icon="share">share</span>
</button>
<button class="hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-16 pb-24 px-screen-margin overflow-y-auto">
<div class="max-w-2xl mx-auto py-8 flex flex-col gap-8">
<!-- Title Field -->
<section class="flex flex-col gap-2">
<input class="w-full bg-transparent border-none focus:ring-0 font-h1 text-h1 uppercase text-on-surface p-0 placeholder-on-surface/50" placeholder="NOTE TITLE" type="text" value="DESIGN SYSTEM AUDIT"/>
</section>
<!-- Priority Selector -->
<section class="flex flex-col gap-4">
<h3 class="font-section-header text-section-header uppercase text-on-surface/60">Select Priority</h3>
<div class="flex flex-wrap gap-3">
<!-- Terracotta (Active) -->
<button class="px-6 py-2 rounded-full bg-tertiary text-on-tertiary border border-on-surface flex items-center gap-2 transition-transform active:scale-95">
<span class="font-label-priority text-label-priority uppercase">High</span>
</button>
<!-- Sandy Brown -->
<button class="px-6 py-2 rounded-full bg-tertiary-fixed text-on-tertiary-fixed-variant prussian-border hover:bg-tertiary-fixed-dim transition-colors">
<span class="font-label-priority text-label-priority uppercase">Medium</span>
</button>
<!-- Light Gold -->
<button class="px-6 py-2 rounded-full bg-secondary-fixed text-on-secondary-fixed-variant prussian-border hover:bg-secondary-fixed-dim transition-colors">
<span class="font-label-priority text-label-priority uppercase">Low</span>
</button>
<!-- Custard -->
<button class="px-6 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant prussian-border hover:bg-surface-container-low transition-colors">
<span class="font-label-priority text-label-priority uppercase">Idea</span>
</button>
</div>
</section>
<!-- Tags -->
<section class="flex flex-col gap-4">
<h3 class="font-section-header text-section-header uppercase text-on-surface/60">Tags</h3>
<div class="flex flex-wrap gap-2">
<span class="px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-metadata text-metadata flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="sell">sell</span>
                        BAUHAUS
                    </span>
<span class="px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-metadata text-metadata flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="sell">sell</span>
                        ARCHITECTURE
                    </span>
<span class="px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-metadata text-metadata flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="sell">sell</span>
                        MOBILE_UI
                    </span>
<button class="px-3 py-1 rounded-full border border-dashed border-on-surface/30 text-on-surface/60 font-metadata text-metadata flex items-center gap-1 hover:bg-on-surface/5">
<span class="material-symbols-outlined text-[14px]" data-icon="add">add</span>
                        ADD TAG
                    </button>
</div>
</section>
<!-- Editor Area -->
<section class="flex flex-col flex-1 min-h-[400px]">
<textarea class="w-full flex-1 bg-secondary-container/20 rounded-lg p-card-padding font-body-lg text-body-lg text-on-surface prussian-border focus:prussian-border-focus focus:ring-0 resize-none" placeholder="Start capturing your thoughts...">The Bauhaus design language emphasizes functionalism and geometric purity. For the upcoming mobile audit, we must ensure that all structural elements align with the 8px grid. 

Current Observations:
1. Border weights are inconsistent across the dashboard cards.
2. The color palette lacks a proper tertiary accent for actionable components.
3. Typography hierarchy needs a stronger Oswald bold anchor for headers to maintain the editorial feel.

Recommendations:
- Implement a rigid 1px border system with 15% opacity.
- Use Sandy Brown specifically for primary CTAs to drive high contrast against the Vanilla background.
- Increase leading on body text to improve legibility on small screens.</textarea>
</section>
<!-- Attachment Section (Asymmetric Layout) -->
<section class="grid grid-cols-2 gap-stack-gap">
<div class="relative group aspect-video rounded-xl overflow-hidden prussian-border">
<img alt="Design Audit Reference" class="w-full h-full object-cover" data-alt="A top-down photographic view of a minimalist designer's workspace featuring a laptop, a black sketchbook, and high-quality mechanical pencils. The scene is lit by warm morning sunlight coming through a window, casting soft shadows. The aesthetic is clean and intellectual, following a professional light-mode palette with subtle gold and dark blue accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0JBUMo1UEggLzVvCkLE2dkf3lAlgQ3GJc27RbjwSze7HfuTXN1j1DkpFqU0vzCmgypyCy16SVF3CTKvwvxZykzs_oQtfTnYq7PE0HaZxIuGzh7KOKWL0vbOs2e0YhtsdbHy1XOyv4f2dKoOVdrdLiWbcTV7q0FGVRAzDlP5JBMQBAakDz4qlMeGayagK05LujQf0wsN0gRSmmM7S-2iAdmSzHFQEEYzNYKWqIMoNg9Ncl-xjhF0bEat8HjyTVCRLY_Zs-oFeCyx0"/>
<div class="absolute inset-0 bg-on-surface/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white" data-icon="zoom_in">zoom_in</span>
</div>
</div>
<div class="bg-tertiary-container rounded-xl p-card-padding flex flex-col justify-between prussian-border">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-on-tertiary-container" data-icon="mic">mic</span>
<span class="font-metadata text-metadata text-on-tertiary-container">0:45</span>
</div>
<div class="h-8 flex items-end gap-1">
<div class="w-1 bg-on-tertiary-container h-3 rounded-full"></div>
<div class="w-1 bg-on-tertiary-container h-5 rounded-full"></div>
<div class="w-1 bg-on-tertiary-container h-8 rounded-full"></div>
<div class="w-1 bg-on-tertiary-container h-4 rounded-full"></div>
<div class="w-1 bg-on-tertiary-container h-6 rounded-full"></div>
<div class="w-1 bg-on-tertiary-container h-7 rounded-full"></div>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-screen-margin bg-primary-container/80 backdrop-blur-sm z-50">
<div class="max-w-2xl mx-auto">
<button class="w-full bg-tertiary text-on-tertiary font-button-text text-button-text py-4 rounded-lg uppercase tracking-wider shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="save">save</span>
                SAVE
            </button>
</div>
</div>
</body></html>
